name: Feature suggestion
description: Suggest an improvement to the research tool.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
      description: Describe the use case without private case details or identifying information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the improvement and any alternatives you considered.
    validations:
      required: true
