name: Software bug
description: Report a reproducible problem with the software.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security reports, follow SECURITY.md. For case corrections or removal requests, email courtney@latenttrace.org. Do not attach credentials, private information, or database dumps."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain the difference using a sanitized example.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page or command and the smallest reproducible steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, or commit and runtime versions for local development.
    validations:
      required: true
