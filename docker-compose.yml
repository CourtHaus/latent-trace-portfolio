version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: casesignal-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casesignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (copy .env.example to .env and set it)}
      POSTGRES_DB: ${POSTGRES_DB:-casesignal}
    ports:
      - "127.0.0.1:5433:5432"
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
