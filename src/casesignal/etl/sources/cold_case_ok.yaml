      pages. OSBI is the first-party investigating agency. No per-case URLs
      and no structured age/race/sex/county — nearly every field lives in the
      narrative prose and is recovered by Tier-1/Tier-2 LLM extraction. A
      conservative narrative-county regex provides a partial geocoding floor.
      Plain HTTP 200 (no Cloudflare); robots.txt allow-all.
