    description: >-
      Washington D.C. Metropolitan Police Department — official
      unsolved-homicides hub. Multi-year-page index linking to per-case
      detail pages with downloadable PDF reward bulletins. CaseSignal
      extracts the CCN + victim photo + detective contacts from each
      PDF. Phase 1.8a covers 2020 only as proof of the architecture;
      Phase 1.8b expands to 1951-2019.
