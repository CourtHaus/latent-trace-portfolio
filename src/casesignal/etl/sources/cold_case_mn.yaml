    description: >-
      Minnesota Bureau of Criminal Apprehension statewide Unsolved Cases
      compendium (homicides only). The case list sits behind an Imperva WAF;
      it is harvested out-of-band via a browser console fetch against the
      SharePoint REST API (see the cold_case_mn_bca adapter docstring and the
      Phase 8 design doc). Per-case Summary-of-Case PDFs and victim photos are
      static assets fetched programmatically.
